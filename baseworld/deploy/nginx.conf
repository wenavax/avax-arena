# =========================================================================
# nginx config — frostbite.pro/baseworld → self-hosted Next.js
# =========================================================================
#
# 2 yaklaşım var, birini seç:
#
# YAKLAŞIM A (önerilir): Next.js PM2'de standalone port'ta çalışır
#   - baseworld/web 'i VPS'e rsync, pm2 ile :3002 portunda başlat
#   - bu config'i sites-available/frostbite.pro'ya location bloğu olarak ekle
#   - next.config.mjs'de basePath KAPALI olmalı (varsayılan)
#
# YAKLAŞIM B: Next basePath ile / altından açılır
#   - next.config.mjs'de: basePath: "/baseworld", assetPrefix: "/baseworld"
#   - sadece proxy_pass'i basitleştir, basePath rewrite gerekmez
#
# Aşağıdaki blok YAKLAŞIM A içindir.

# /baseworld/uploads/ — NFT görselleri (VPS local storage backend)
# Bu Next.js'i bypass eder, nginx direkt diskten serve eder → çok hızlı.
location /baseworld/uploads/ {
    alias /opt/baseworld/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    # Sadece güvenli image tipleri (Content-Type sniffing önle)
    add_header X-Content-Type-Options nosniff;
    # CORS — gelecekte üçüncü taraflar harita preview kullanabilir
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
}

location /baseworld {
    # /baseworld → / olarak rewrite et (Next basePath kapalıysa)
    rewrite ^/baseworld(/.*)?$ $1 break;

    proxy_pass         http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";

    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # /api/upload için body limiti (2 MB görsel + form overhead)
    client_max_body_size 4M;
}

# Next.js static assets — basePath rewrite kapsamı dışında
# (Next basePath kapalıyken /_next/* root altından gider)
location /_next/baseworld {
    rewrite ^/_next/baseworld/(.*)$ /_next/$1 break;
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# =========================================================================
# PM2 process (server'da)
# =========================================================================
# Yerel:
#   cd baseworld/web && pnpm build
# Sonra rsync:
#   rsync -avz --delete \
#     --exclude='node_modules' \
#     --exclude='.env' --exclude='.env.local' \
#     -e "ssh -i ~/.ssh/id_ed25519" \
#     /Users/hts_bot/avax-arena/baseworld/web/ \
#     root@5.189.173.167:/opt/baseworld/web/
# VPS'te:
#   cd /opt/baseworld/web && pnpm install --frozen-lockfile
#   pm2 start "PORT=3002 pnpm start" --name baseworld-web
#   pm2 save
# =========================================================================
